<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>授权完成 - MuseDrive</title>
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; max-width: 640px; margin: 48px auto; padding: 0 20px; color: #222; line-height: 1.6; }
  h1 { font-size: 22px; }
  textarea { width: 100%; height: 96px; font-size: 13px; padding: 10px; box-sizing: border-box; }
  button { margin-top: 12px; padding: 10px 20px; font-size: 16px; }
  .note { color: #666; font-size: 14px; }
</style>
</head>
<body>
<h1>授权完成</h1>
<p>请把下面这条完整地址复制下来，回到 Muse 聊天里发给 Muse，用来完成令牌交换。授权码是一次性的、几分钟内有效，请尽快粘贴。</p>
<textarea id="url" readonly></textarea><br>
<button onclick="copyUrl()">复制地址</button>
<p class="note" id="msg"></p>
<script>
  document.getElementById('url').value = window.location.href;
  function copyUrl() {
    var t = document.getElementById('url');
    t.select();
    document.execCommand('copy');
    document.getElementById('msg').textContent = '已复制，去发给 Muse 吧。';
  }
</script>
</body>
</html>
